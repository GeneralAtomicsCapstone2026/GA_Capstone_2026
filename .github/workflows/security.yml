name: Development security

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Security_Team

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check environment
        run: |
          python --version
          openssl version
          python -c "import ssl; print(ssl.OPENSSL_VERSION); assert ssl.HAS_TLSv1_3"

      - name: Run tests
        run: python run_tests.py

  lint:
    name: Python lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        working-directory: Security_Team

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .

  sast:
    name: Python security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        working-directory: Security_Team

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Generate full security report
        run: python -m bandit -r . -f json -o bandit-report.json --exit-zero

      - name: Check for medium and high findings
        run: python -m bandit -r . --severity-level medium

      - name: Save security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: Security_Team/bandit-report.json
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git /repo --redact

  sca:
    name: Dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Security_Team

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip_audit -r requirements-dev.txt --strict
